name: Build Pokemon SV v1.2.6 PRODUCTION (enhanced offline snapshot)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production-pages
  cancel-in-progress: true

jobs:
  build:
    # Safeguard: this workflow deploys ONLY from the production repository.
    if: github.repository == 'kkzige/pokemon-sv-guide'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validate required files
        run: |
          python -m py_compile build_sv_data.py enrich_sv_data.py enrich_sv_acquisition.py
          test -s sv_acquisition_data.json
          test -s sv_special_evolutions.json
          for f in index.html sw.js manifest.webmanifest icon.svg apple-touch-icon.png version.json; do test -s "$f"; done
      - name: Generate verified full offline snapshot
        run: |
          mkdir -p site
          python build_sv_data.py --output site/sv-data.json --coverage site/coverage.json
      - name: Enrich existing move catalog with PP and short Chinese game text
        run: |
          python enrich_sv_data.py --input site/sv-data.json --coverage site/coverage.json
      - name: Merge version exclusives, representative habitats and TM material sources
        run: |
          python enrich_sv_acquisition.py --input site/sv-data.json --coverage site/coverage.json --data sv_acquisition_data.json
      - name: Verify curated 90-entry special evolution data
        run: |
          python - <<'PYEVOGATE'
          import json
          from pathlib import Path
          d=json.loads(Path('sv_special_evolutions.json').read_text('utf-8'))
          rows=d['records']
          assert d['schema']==1 and len(rows)==90
          assert len({x['id'] for x in rows})==90
          assert len({x['method'] for x in rows})==41
          assert sum(x['inSV']=='可以' for x in rows)==86
          assert sum(x['inSV'].startswith('不可以') for x in rows)==3
          assert sum('非进化' in x['inSV'] for x in rows)==1
          assert all(sum(x['stats'])==x['total'] for x in rows)
          assert all(x['sourceEvolution'].startswith('https://') for x in rows)
          assert any(x['from']=='火暴猴' and x['to']=='弃世猴' for x in rows)
          print('SPECIAL EVOLUTION DATA GATE PASS:',len(rows))
          PYEVOGATE
      - name: Verify data completeness before publishing production
        run: |
          python - <<'PYVERIFY'
          import json
          from pathlib import Path
          c=json.loads(Path('site/coverage.json').read_text(encoding='utf-8'))
          d=json.loads(Path('site/sv-data.json').read_text(encoding='utf-8'))
          for region,n in {'帕底亚':400,'北上乡':200,'蓝莓':243}.items():
              assert c['regionSpecies'].get(region,0)>=n,(region,c['regionSpecies'].get(region,0))
          assert c['pokemonSpeciesSearchable']>=400,c
          assert c['svMoveEntries']>=350,c
          assert c['movePpEntries']>=350,c
          assert c['svNativeExclusiveForms']>=48,c
          assert c['svTmMaterialTypes']>=170,c
          assert c['svTmMaterialSpecies']>=250,c
          assert c['svVerifiedHabitatRecords']>=20,c
          assert len(d['pokemon'])>=500,len(d['pokemon'])
          # The showcased four-slot Iron Hands builds must not silently disappear.
          iron=next((p for p in d['pokemon'] if p['en']=='iron-hands'),None)
          required={'belly-drum','drain-punch','thunder-punch','electric-terrain','swords-dance','ice-punch'}
          assert iron and 'quark-drive' in iron.get('abilities',[]), 'Iron Hands ability data missing'
          assert required <= set(iron.get('learnset',{})), ('Iron Hands learnset incomplete', sorted(required-set(iron.get('learnset',{}))))
          assert required <= set(d['moves']), 'Iron Hands move parameters missing'
          print('PRODUCTION DATA GATE PASS')
          print(json.dumps(c,ensure_ascii=False,indent=2))
          PYVERIFY
      - name: Assemble self-contained production PWA for iPhone Safari
        run: |
          cp sw.js manifest.webmanifest icon.svg apple-touch-icon.png version.json sv_special_evolutions.json site/
          python - <<'PYEMBED'
          import json
          from pathlib import Path
          data=Path('site/sv-data.json').read_text(encoding='utf-8')
          obj=json.loads(data)
          assert obj['schema']==1 and len(obj['pokemon'])>=500
          assert len(obj['directory'])>=400 and len(obj['moves'])>=350
          # Inert JSON in the same HTML download: Safari needs no second fetch.
          safe=data.replace('<',r'\u003c')
          marker='<script id="sv-offline-snapshot" type="application/json">'+safe+'</script>'
          html=Path('index.html').read_text(encoding='utf-8')
          assert '</head>' in html and 'initSVSnapshot' in html
          assert "const APP_VERSION='1.2.6'" in html
          assert json.loads(Path('version.json').read_text('utf-8'))['version']=='1.2.6'
          assert 'pokemon-sv-guide-v1.2.6' in Path('sw.js').read_text('utf-8')
          assert all(x in html for x in ['natureMatrix','mintPanel','moveClassGuide','MINT_NATURES','renderExpertEvolutionHint','renderTactics','tacticScore','tacticBuilds','TACTIC_IRON_SETS'])
          evo=Path('sv_special_evolutions.json').read_text(encoding='utf-8')
          evo_obj=json.loads(evo)
          assert evo_obj['schema']==1 and len(evo_obj['records'])==90
          evo_safe=evo.replace('<',r'\u003c')
          evo_marker='<script id="sv-special-evolution-90" type="application/json">'+evo_safe+'</script>'
          html=html.replace('</head>',marker+'\n'+evo_marker+'\n</head>',1)
          Path('site/index.html').write_text(html,encoding='utf-8')
          coverage_file=Path('site/coverage.json')
          coverage=json.loads(coverage_file.read_text(encoding='utf-8'))
          coverage['version']='1.2.6'
          coverage_file.write_text(json.dumps(coverage,ensure_ascii=False,indent=2),encoding='utf-8')
          assert json.loads(safe)['schema']==1
          assert len(json.loads(evo_safe)['records'])==90
          print('PRODUCTION HTML INLINE DATABASE:',len(data),'JSON characters')
          print('PRODUCTION HTML SIZE:',Path('site/index.html').stat().st_size,'bytes')
          PYEMBED
          test -s site/index.html && test -s site/sv-data.json
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.repository == 'kkzige/pokemon-sv-guide'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified production PWA to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
